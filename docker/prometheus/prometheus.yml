global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api_gateway"
    static_configs:
      - targets: ["api_gateway:8000"]
    metrics_path: /metrics

  - job_name: "legacy_simulator"
    static_configs:
      - targets: ["legacy_simulator:7000"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
